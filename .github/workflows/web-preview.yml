name: Web Preview (disabled)

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  unavailable:
    if: contains(github.event.pull_request.labels.*.name, 'preview:web')
    runs-on: ubuntu-24.04
    steps:
      - name: Hosted web deployment unavailable
        run: |
          echo '::notice::Hosted web deployment is not supported in this fork. No build or deployment was attempted. Direct and Tailscale pairing remain available.'
          echo 'Hosted web deployment is disabled for this fork. See docs/operations/hosted-fork.md.' >> "$GITHUB_STEP_SUMMARY"
