name: Deploy Connect relay

on:
  push:
    branches:
      - main
    paths:
      - "infra/relay/**"
      - "packages/contracts/**"
      - "packages/shared/**"
      - "packages/client-runtime/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-relay.yml"
  # Redeploys main after a variable or secret change. Alchemy redeploys the
  # Worker when a value it reads changes, so force is rarely needed.
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy every resource, including ones with no detected changes.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    # Manual runs from another branch would deploy that branch to production.
    # Push runs skip cleanly while RELAY_API_ZONE_NAME is unset at repository scope.
    if: >-
      github.repository == 'shuv1337/s2code' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RELAY_API_ZONE_NAME != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      RELAY_DB_HOST: ${{ vars.RELAY_DB_HOST }}
      RELAY_DB_PORT: ${{ vars.RELAY_DB_PORT }}
      RELAY_DB_NAME: ${{ vars.RELAY_DB_NAME }}
      RELAY_DB_USER: ${{ vars.RELAY_DB_USER }}
      RELAY_DB_CONNECTION_LIMIT: ${{ vars.RELAY_DB_CONNECTION_LIMIT }}
      RELAY_DB_MIGRATION_SSLMODE: ${{ vars.RELAY_DB_MIGRATION_SSLMODE }}
      RELAY_DB_CLUSTER_SIZE: ${{ vars.RELAY_DB_CLUSTER_SIZE }}
      RELAY_DB_REPLICAS: ${{ vars.RELAY_DB_REPLICAS }}
      RELAY_OTLP_TRACES_URL: ${{ vars.RELAY_OTLP_TRACES_URL }}
      RELAY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_TUNNEL_CLEANUP_MODE }}
      RELAY_LEGACY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_LEGACY_TUNNEL_CLEANUP_MODE }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENABLED: ${{ vars.APNS_ENABLED || 'false' }}
      FEEDBACK_GITHUB_REPO: ${{ vars.FEEDBACK_GITHUB_REPO }}
      FEEDBACK_GITHUB_AUTO_ISSUES: ${{ vars.FEEDBACK_GITHUB_AUTO_ISSUES || 'false' }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Verify fork relay ownership configuration
        env:
          RELAY_DB_PASSWORD: ${{ secrets.RELAY_DB_PASSWORD }}
          RELAY_DB_ACCESS_CLIENT_ID: ${{ secrets.RELAY_DB_ACCESS_CLIENT_ID }}
          RELAY_DB_ACCESS_CLIENT_SECRET: ${{ secrets.RELAY_DB_ACCESS_CLIENT_SECRET }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
        run: node --input-type=module -e 'import { assertForkRelayDeploymentEnv } from "./infra/relay/src/forkOwnership.ts"; assertForkRelayDeploymentEnv(process.env);'

      - name: Run external Postgres migrations
        if: env.RELAY_DB_HOST != ''
        env:
          RELAY_DB_PASSWORD: ${{ secrets.RELAY_DB_PASSWORD }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.RELAY_DB_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.RELAY_DB_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$TUNNEL_SERVICE_TOKEN_ID" ] || [ -n "$TUNNEL_SERVICE_TOKEN_SECRET" ]; then
            if [ -z "$TUNNEL_SERVICE_TOKEN_ID" ] || [ -z "$TUNNEL_SERVICE_TOKEN_SECRET" ]; then
              echo "::error::RELAY_DB_ACCESS_CLIENT_ID and RELAY_DB_ACCESS_CLIENT_SECRET must both be set." >&2
              exit 1
            fi
            cf_bin="$RUNNER_TEMP/cloudflared"
            curl -fsSL --retry 3 -o "$cf_bin" \
              "https://github.com/cloudflare/cloudflared/releases/download/2026.10.4/cloudflared-linux-amd64"
            echo "ae5e8add7884b0531d66bbca4570d1de491ff6da51e4ebe7eb160cdf241d9e42  $cf_bin" | sha256sum -c -
            chmod +x "$cf_bin"
            # Service token credentials travel through TUNNEL_SERVICE_TOKEN_* env, never argv.
            "$cf_bin" access tcp \
              --hostname "$RELAY_DB_HOST" \
              --url 127.0.0.1:15432 &
            cf_pid=$!
            trap 'kill "$cf_pid" 2>/dev/null || true' EXIT
            node -e '
              const net = require("node:net");
              const deadline = Date.now() + 15_000;
              (function probe() {
                const socket = net.connect(15432, "127.0.0.1");
                socket.once("connect", () => { socket.destroy(); process.exit(0); });
                socket.once("error", () => {
                  socket.destroy();
                  if (Date.now() >= deadline) {
                    console.error("Timed out waiting for cloudflared access tcp listener.");
                    process.exit(1);
                  }
                  setTimeout(probe, 200);
                });
              })();
            '
            RELAY_DB_MIGRATION_TARGET_HOST="127.0.0.1" \
            RELAY_DB_MIGRATION_TARGET_PORT="15432" \
            RELAY_DB_MIGRATION_SSLMODE="${RELAY_DB_MIGRATION_SSLMODE:-disable}" \
              vp run --filter t3code-relay migrate:postgres
          else
            RELAY_DB_MIGRATION_SSLMODE="${RELAY_DB_MIGRATION_SSLMODE:-require}" \
              vp run --filter t3code-relay migrate:postgres
          fi

      - name: Deploy production relay stage
        run: vp run --filter t3code-relay deploy --stage prod --yes --no-input ${{ inputs.force && '--force' || '' }}
        env:
          # The PublishClientConfig action writes the client env here instead
          # of the repo-root .env; nothing on the runner reads it.
          T3CODE_RELAY_CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RELAY_DB_PASSWORD: ${{ secrets.RELAY_DB_PASSWORD }}
          RELAY_DB_ACCESS_CLIENT_ID: ${{ secrets.RELAY_DB_ACCESS_CLIENT_ID }}
          RELAY_DB_ACCESS_CLIENT_SECRET: ${{ secrets.RELAY_DB_ACCESS_CLIENT_SECRET }}
          RELAY_OTLP_TRACES_TOKEN: ${{ secrets.RELAY_OTLP_TRACES_TOKEN }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description: "Relay production deploy completed.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish public relay outputs to summary
        env:
          CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import * as fs from "node:fs";
            import * as util from "node:util";
            const file = process.env.CLIENT_CONFIG_ENV;
            const summary = process.env.GITHUB_STEP_SUMMARY;
            if (!file) process.exit(0);
            if (!fs.existsSync(file)) {
              console.log("Public relay outputs unchanged since previous deploy.");
              if (summary) {
                fs.appendFileSync(summary, "### Public relay outputs\n\nUnchanged since previous deploy.\n");
              }
              process.exit(0);
            }
            const parsed = util.parseEnv(fs.readFileSync(file, "utf8"));
            const publicOutputs = [
              ["T3CODE_RELAY_URL", parsed.T3CODE_RELAY_URL],
              ["T3CODE_CLOUD_MINT_PUBLIC_KEY", parsed.T3CODE_CLOUD_MINT_PUBLIC_KEY],
            ].filter((entry) => Boolean(entry[1]));
            for (const [key, value] of publicOutputs) {
              console.log(`${key}=${value}`);
            }
            if (summary) {
              const lines = ["### Public relay outputs", ""];
              for (const [key, value] of publicOutputs) {
                lines.push(`- \`${key}\`: \`${value}\``);
              }
              fs.appendFileSync(summary, `${lines.join("\n")}\n`);
            }
          '
