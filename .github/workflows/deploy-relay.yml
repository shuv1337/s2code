name: Relay deployment (disabled)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    runs-on: ubuntu-24.04
    steps:
      - name: Hosted relay deployment unavailable
        run: |
          echo '::notice::Hosted relay deployment is not supported in this fork. No resources were provisioned. Direct and Tailscale pairing remain available.'
          echo 'Hosted relay deployment is disabled for this fork. See docs/operations/hosted-fork.md.' >> "$GITHUB_STEP_SUMMARY"
