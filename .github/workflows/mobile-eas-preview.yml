name: Mobile EAS Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

jobs:
  preview:
    name: EAS Preview
    # Fork PRs deploy one reviewed commit per label through mobile-eas-preview-fork.yml.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, '🚀 Mobile Continuous Deployment') &&
      (github.event.action != 'labeled' || github.event.label.name == '🚀 Mobile Continuous Deployment')
    runs-on: ubuntu-24.04
    concurrency:
      group: mobile-eas-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      APP_VARIANT: preview
      NODE_OPTIONS: --max-old-space-size=8192
      MOBILE_VERSION_POLICY: fingerprint
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MOBILE_UPDATES_ENABLED: ${{ vars.MOBILE_UPDATES_ENABLED || '0' }}
      MOBILE_PUSH_ENABLED: ${{ vars.MOBILE_PUSH_ENABLED || '0' }}
      MOBILE_AUTH_ENABLED: ${{ vars.MOBILE_AUTH_ENABLED || '0' }}
      MOBILE_AUTH_DOMAIN: ${{ vars.MOBILE_AUTH_DOMAIN }}
      MOBILE_RELAY_URL: ${{ vars.MOBILE_RELAY_URL }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
    steps:
      - id: expo-token
        name: Check for EXPO_PREVIEW_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR dry run: EXPO_TOKEN is unavailable; no EAS build or OTA delivery was attempted."
            echo '## PR dry run — no EAS delivery attempted (EXPO_TOKEN unavailable)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          # eas-cli 22 renamed `project` to `app` in build JSON, and
          # continuous-deploy-fingerprint still reads `build.project.ownerAccount`.
          # Unpin once https://github.com/expo/expo-github-action/issues/358 is fixed.
          eas-version: 21.8.0
          token: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Verify fork Expo identity before preview environment pull
        if: steps.expo-token.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/mobile-release-preflight.ts project --mode preview --profile preview:dev --platform all

      - name: Pull preview environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
        run: |
          eas env:pull preview --non-interactive

      - name: Verify preview native identities and enabled capabilities
        if: steps.expo-token.outputs.present == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/mobile-release-preflight.ts prepare --mode preview --profile preview:dev --platform all

      - name: Schedule preview binary when OTA is disabled
        if: steps.expo-token.outputs.present == 'true' && env.MOBILE_UPDATES_ENABLED != '1'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --profile preview:dev --platform all --non-interactive --no-wait
          echo '## Preview binary scheduled; OTA explicitly disabled. Scheduling is not device delivery.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy with fingerprint check
        if: steps.expo-token.outputs.present == 'true' && env.MOBILE_UPDATES_ENABLED == '1'
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_PREVIEW_TOKEN }}
          # The Expo action otherwise suppresses the EAS command's failure output.
          RUNNER_DEBUG: "1"
        with:
          profile: preview:dev
          branch: pr-${{ github.event.pull_request.number }}
          platform: all
          environment: preview
          working-directory: apps/mobile
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean generated submission directory
        if: always()
        run: |
          case "${MOBILE_SUBMISSION_CREDENTIALS_DIR:-}" in
            "$RUNNER_TEMP"/fork-mobile-submit-*) rm -rf -- "$MOBILE_SUBMISSION_CREDENTIALS_DIR" ;;
            '') ;;
            *) echo 'Unexpected credential directory; refusing cleanup.' >&2; exit 1 ;;
          esac
