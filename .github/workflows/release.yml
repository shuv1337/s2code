name: Fork release

# The fork ships nightly only. The scripts keep upstream's stable/preview
# branches so merges stay clean, but nothing here can start them.
on:
  schedule:
    # Daily at 09:17 UTC (2:17 AM PDT, 1:17 AM PST). Skipped when main has no
    # new commits or the last nightly is less than six hours old.
    - cron: "17 9 * * *"
  # Manual runs release main immediately, without the due check.
  workflow_dispatch:
    inputs:
      promote_version:
        description: Promote only. Move the npm dist-tags to this already published version; builds and changes nothing else.
        required: false
        default: ""
        type: string

# Serialize publication, including the shared release index.
concurrency:
  group: fork-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

# Hosted/relay, marketing and AUR deployment are intentionally not invoked.
# Their accounts and fork-owned destinations are separate prerequisites (#276/#268).
jobs:
  # The PAUSE_NIGHTLY repository variable skips scheduled runs only; every later
  # job needs this one, so a skip here skips the whole run.
  due:
    if: github.repository == 'shuv1337/s2code' && !inputs.promote_version && (github.event_name != 'schedule' || vars.PAUSE_NIGHTLY != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
      allowed_ref: ${{ steps.due.outputs.allowed_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: due
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { assertReleaseSource, shouldReleaseNightly, isAllowedForkPublishRef } = require('./.github/scripts/check-nightly-release.cjs');
            const allowed = isAllowedForkPublishRef(context.ref, context.payload.repository?.default_branch);
            core.setOutput('allowed_ref', String(allowed));
            if (!allowed) {
              core.setOutput('due', 'false');
              core.notice('Release skipped: nightly publication requires the default branch. No publisher token or protected environment requested.');
              return;
            }
            await assertReleaseSource({ github, context, releaseChannel: 'nightly' });
            const due = context.eventName !== 'schedule' || await shouldReleaseNightly({ github, context, core });
            core.setOutput('due', String(due));
            if (!due) core.notice('No release needed: unchanged nightly source or release interval not elapsed. No delivery attempted.');

  preflight:
    needs: due
    if: needs.due.outputs.due == 'true' && needs.due.outputs.allowed_ref == 'true'
    runs-on: ubuntu-24.04
    environment: fork-release
    timeout-minutes: 15
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      mac_signed: ${{ steps.plan.outputs.mac_signed }}
      win_signed: ${{ steps.plan.outputs.win_signed }}
      apple_team_id: ${{ steps.plan.outputs.apple_team_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
      matrix_rest: ${{ steps.split_matrix.outputs.matrix_rest }}
      matrix_mac_arm64: ${{ steps.split_matrix.outputs.matrix_mac_arm64 }}
      matrix_mac_arm64_fallback: ${{ steps.split_matrix.outputs.matrix_mac_arm64_fallback }}
      matrix_win_x64: ${{ steps.split_matrix.outputs.matrix_win_x64 }}
      due: ${{ needs.due.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true
      - id: plan
        name: Resolve one nightly source/version, signing and npm policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: nightly
          # Sign each platform whose credentials are complete; otherwise the
          # release is labeled UNSIGNED.
          ALLOW_UNSIGNED: "true"
          FORK_NPM_TRUSTED_PUBLISHING_READY: ${{ vars.FORK_NPM_TRUSTED_PUBLISHING_READY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          RELEASE_DATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          export RELEASE_DATE
          node scripts/fork-release.ts preflight
      - id: split_matrix
        name: Keep macOS arm64 and Windows x64 out of the shared desktop matrix
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: node .github/scripts/macos-arm64-runner-retry.cjs split-matrix
      - name: Verify release logic
        run: |
          node --test .github/scripts/macos-arm64-runner-retry.test.cjs
          vp test run scripts/lib/fork-release.test.ts scripts/fork-release.test.ts scripts/fork-release-workflow.test.ts scripts/fork-release-publish.test.ts scripts/build-npm-launcher.test.ts scripts/build-desktop-artifact.test.ts scripts/update-release-package-versions.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error

  build_bundle:
    needs: preflight
    if: needs.preflight.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        with:
          node-version-file: package.json
          run-install: true
      # Share only the verification results, not the large registry metadata cache.
      - name: Upload dependency verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          if-no-files-found: error
          retention-days: 1
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Align all compiled surfaces
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - run: vp run build:desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: [preflight, build_bundle]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix_rest) }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: ${{ matrix.cli_archive }}
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      release_publication: true
      # Signing is resolved once, in the release environment; the build jobs
      # cannot see those secrets and must not resolve it again.
      mac_signed: ${{ needs.preflight.outputs.mac_signed == 'true' }}
      win_signed: ${{ needs.preflight.outputs.win_signed == 'true' }}
      # APPLE_TEAM_ID is a variable, and this job is outside the release
      # environment, so the team id comes from preflight rather than `vars`.
      apple_team_id: ${{ needs.preflight.outputs.apple_team_id }}

  # Publish does not require this job: a failed Windows build leaves the Windows
  # assets and npm package out of the release (see the publish job). GitHub
  # refuses continue-on-error on a job that calls a reusable workflow, so
  # win_optional sets it on the build job in release-desktop.yml.
  desktop_win_x64:
    name: Desktop (Windows x64)
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).label }}
      runner: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).runner }}
      platform: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).platform }}
      target: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).target }}
      arch: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).arch }}
      rust_target: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).rust_target }}
      resource_key: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).resource_key }}
      cli_archive: ${{ fromJSON(needs.preflight.outputs.matrix_win_x64).cli_archive }}
      win_optional: true
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      release_publication: true
      mac_signed: ${{ needs.preflight.outputs.mac_signed == 'true' }}
      win_signed: ${{ needs.preflight.outputs.win_signed == 'true' }}
      apple_team_id: ${{ needs.preflight.outputs.apple_team_id }}

  # macOS arm64 builds once on the self-hosted shuvbot runner (owned by Fleet
  # Ops; see docs/operations/release.md). If shuvbot never picks it up, the queue
  # watch below starts one hosted macos-26 build instead. GitHub cancels a hosted
  # job that gets no runner after ~15 minutes (runner_id 0); timeout-minutes does
  # not extend that, and nothing retries it. To revert to hosted runners, set
  # FORK_MACOS_ARM64_SELF_HOSTED_RUNNER in scripts/lib/fork-release.ts to "macos-26".
  desktop_mac_arm64:
    name: Desktop (macOS arm64)
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    # The Mac build gets its own signing secrets and nothing else (no Azure).
    secrets: &mac_arm64_secrets
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
    with:
      label: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).label }}
      runner: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).runner }}
      platform: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).platform }}
      target: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).target }}
      arch: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).arch }}
      rust_target: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).rust_target }}
      resource_key: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).resource_key }}
      cli_archive: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).cli_archive }}
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      release_publication: true
      mac_signed: ${{ needs.preflight.outputs.mac_signed == 'true' }}
      win_signed: ${{ needs.preflight.outputs.win_signed == 'true' }}
      apple_team_id: ${{ needs.preflight.outputs.apple_team_id }}

  # A queued shuvbot job cannot be cancelled on its own, but job-level
  # concurrency can. The hosted fallback below shares attempt 1's group (see
  # release-desktop.yml), so starting it cancels attempt 1 while it is still
  # queued. This watcher starts it when shuvbot has not picked the job up in
  # QUEUE_TIMEOUT_SECONDS (macos-arm64-runner-retry.cjs). It is skipped when the
  # matrix uses a hosted runner.
  mac_arm64_queue_watch:
    name: macOS arm64 shuvbot queue watch
    needs: [preflight, build_bundle]
    if: needs.preflight.outputs.due == 'true' && startsWith(fromJSON(needs.preflight.outputs.matrix_mac_arm64).runner, '[')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      fallback: ${{ steps.watch.outputs.fallback }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$SECONDS
          touch "$RUNNER_TEMP/jobs.jsonl"
          while true; do
            # A read that fails every retry keeps the last one, so an offline shuvbot still times out into the fallback.
            node .github/scripts/macos-arm64-runner-retry.cjs jobs "$RUNNER_TEMP/jobs.jsonl" || echo "::warning::Judging the shuvbot queue from the last successful jobs read."
            state="$(node .github/scripts/macos-arm64-runner-retry.cjs queue-state "$RUNNER_TEMP/jobs.jsonl" "$((SECONDS - started))")"
            echo "shuvbot queue: $state after $((SECONDS - started))s"
            case "$state" in
              picked-up)
                echo "fallback=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              timeout)
                echo "::notice::shuvbot did not pick up the macOS arm64 build in time. Starting a hosted macos-26 build, which cancels the queued job."
                echo "fallback=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            sleep 15
          done

  desktop_mac_arm64_queue_fallback:
    name: Desktop (macOS arm64 queue fallback)
    needs: [preflight, build_bundle, mac_arm64_queue_watch]
    if: needs.mac_arm64_queue_watch.outputs.fallback == 'true'
    uses: ./.github/workflows/release-desktop.yml
    secrets: *mac_arm64_secrets
    with:
      label: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).label }}
      runner: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64_fallback).runner }}
      platform: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).platform }}
      target: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).target }}
      arch: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).arch }}
      rust_target: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).rust_target }}
      resource_key: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).resource_key }}
      cli_archive: ${{ fromJSON(needs.preflight.outputs.matrix_mac_arm64).cli_archive }}
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      release_publication: true
      mac_signed: ${{ needs.preflight.outputs.mac_signed == 'true' }}
      win_signed: ${{ needs.preflight.outputs.win_signed == 'true' }}
      apple_team_id: ${{ needs.preflight.outputs.apple_team_id }}

  mac_arm64_ready:
    name: macOS arm64 runner acquired
    needs: [preflight, desktop_mac_arm64, desktop_mac_arm64_queue_fallback]
    if: always() && !cancelled() && needs.preflight.outputs.due == 'true' && needs.desktop_mac_arm64.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Require one macOS arm64 build that acquired a runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/macos-arm64-runner-retry.cjs jobs "$RUNNER_TEMP/jobs.jsonl"
          node .github/scripts/macos-arm64-runner-retry.cjs gate "$RUNNER_TEMP/jobs.jsonl"

  # Publish shapes the release assets itself so they download once instead of
  # round-tripping as a multi-gigabyte artifact. A rerun rebuilds the same npm
  # bytes from this run's build artifacts. desktop_win_x64 is waited for but
  # not required.
  publish:
    needs: [due, preflight, desktop, desktop_win_x64, mac_arm64_ready]
    if: >-
      always() &&
      !cancelled() &&
      needs.due.result == 'success' &&
      needs.preflight.result == 'success' &&
      needs.desktop.result == 'success' &&
      needs.mac_arm64_ready.result == 'success' &&
      needs.due.outputs.allowed_ref == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04 # npm trusted publishing requires GitHub-hosted runners.
    environment: fork-release
    # Downloads, shapes and uploads the desktop assets; npm review is never awaited.
    timeout-minutes: 90
    outputs:
      windows_built: ${{ steps.windows.outputs.built }}
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      FORK_NPM_TRUSTED_PUBLISHING_READY: ${{ vars.FORK_NPM_TRUSTED_PUBLISHING_READY }}
      NPM_TOKEN: ""
      NODE_AUTH_TOKEN: ""
    steps:
      # The desktop artifacts (about 6 GB) and the npm builds share this disk.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true
      - name: Pin npm with OIDC publish and dist-tag support; no token fallback
        run: |
          npm install --global npm@11.21.0
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/fork-npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/fork-npmrc" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: prepared/release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: prepared/release-assets
      # The Windows build uploads its installer only after its launch, signature
      # and WSL payload checks pass, so the installer decides whether Windows ships.
      - name: Check whether Windows x64 built
        id: windows
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -f "prepared/release-assets/S2Code-${RELEASE_VERSION}-x64.exe" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Windows x64 build failed. This release leaves out the Windows assets, and the npm launcher has no Windows build."
            # A CLI archive uploaded before the failure must not be pinned by the launcher.
            rm -f "prepared/release-assets/s2code-${RELEASE_VERSION}-win32-x64.zip"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      # The launcher pins a checksum for each archive that built; without Windows it lists the rest.
      - name: Build the shuv2code npm launcher from the verified-source archives
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WINDOWS_BUILT: ${{ steps.windows.outputs.built }}
        run: |
          args=()
          if [ "$WINDOWS_BUILT" != "true" ]; then args=(--allow-missing); fi
          node scripts/build-npm-launcher.ts --archives-dir prepared/release-assets --version "$RELEASE_VERSION" --output-dir prepared/npm-packages "${args[@]}"
      - name: Log disk before publish
        run: df -h /
      # Shapes the assets (feeds, CLI aliases, SHA256SUMS, release.json) and logs
      # disk again before uploading anything.
      - name: Shape assets, publish the verified release and index, then npm and its dist-tags
        id: publish
        env:
          WINDOWS_BUILT: ${{ steps.windows.outputs.built }}
        run: node scripts/fork-release.ts publish --execute
      # Runs only after the publish step succeeds; a Discord failure never fails the release.
      - name: Announce the release on Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WINDOWS_BUILT: ${{ steps.windows.outputs.built }}
          NPM_STATUS: ${{ steps.publish.outputs.npm }}
          NPM_ERROR: ${{ steps.publish.outputs.npm_error }}
        run: |
          tag="v${RELEASE_VERSION}"
          if [ -z "$DISCORD_RELEASE_WEBHOOK_URL" ]; then echo "Discord webhook secret is unset; skipping."; exit 0; fi
          # One post per version: claim it with a ref first. A re-run finds the ref and skips.
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/discord-announced/${tag}" -f "sha=$(git rev-parse HEAD)" >/dev/null 2>claim.err; then
            if grep -q 'Reference already exists' claim.err; then echo "${tag} was already announced; skipping."; else echo "Could not record the announcement claim; skipping."; fi
            exit 0
          fi
          # This post already says npm is live, so no promotion follow-up is needed.
          if [ "$NPM_STATUS" = "promoted" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/discord-announced/${tag}-npm" -f "sha=$(git rev-parse HEAD)" >/dev/null 2>&1 || true
          fi
          extra_args=()
          if [ "$FORK_NPM_TRUSTED_PUBLISHING_READY" = "true" ]; then extra_args=(--npm shuv2code); fi
          if [ "$NPM_STATUS" = "pending" ]; then extra_args+=(--link "npm: pending review; the dist-tags stay on the previous version until it is promoted"); fi
          if [ "$NPM_STATUS" = "failed" ]; then extra_args+=(--link "npm: check failed (${NPM_ERROR}); the dist-tags stay on the previous version until it is promoted"); fi
          if [ "$WINDOWS_BUILT" != "true" ]; then extra_args+=(--link "windows: not built; npx shuv2code is unavailable on Windows for this version"); fi
          status=0
          bash .github/scripts/notify-discord-release.sh \
            --project S2Code \
            --version "$tag" \
            "${extra_args[@]}" \
            --link "release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            || status=$?
          exit "$status"
      # A re-run that promotes a version announced as pending posts one follow-up.
      - name: Announce the npm promotion on Discord
        if: steps.publish.outputs.npm == 'promoted'
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash .github/scripts/announce-npm-promotion.sh "v${RELEASE_VERSION}"

  # Promote-only: once npm shows a version an earlier run left pending review, move
  # its dist-tags. Nothing is built, uploaded or published (docs/operations/release.md).
  promote:
    name: Promote npm dist-tags
    if: >-
      github.repository == 'shuv1337/s2code' &&
      inputs.promote_version != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04 # npm trusted publishing requires GitHub-hosted runners.
    environment: fork-release
    timeout-minutes: 15
    permissions:
      # Only for the Discord claim ref; the tags move through OIDC.
      contents: write
      id-token: write
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      FORK_NPM_TRUSTED_PUBLISHING_READY: ${{ vars.FORK_NPM_TRUSTED_PUBLISHING_READY }}
      NPM_TOKEN: ""
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: true
      - name: Pin npm with OIDC dist-tag support; no token fallback
        run: |
          npm install --global npm@11.21.0
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/fork-npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/fork-npmrc" >> "$GITHUB_ENV"
      - name: Promote the published version once npm shows it
        id: promote
        env:
          PROMOTE_VERSION: ${{ inputs.promote_version }}
        run: node scripts/fork-release.ts promote --execute
      - name: Announce the npm promotion on Discord
        if: steps.promote.outputs.npm == 'promoted'
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          PROMOTE_VERSION: ${{ inputs.promote_version }}
        run: bash .github/scripts/announce-npm-promotion.sh "v${PROMOTE_VERSION}"

  # Publish does not wait on Windows, but a release without it must not look green.
  windows_missing:
    name: Windows x64 left out of the release
    needs: publish
    if: always() && needs.publish.outputs.windows_built == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::The Windows x64 build failed, so this release has no Windows installer, Windows CLI archive or Windows npm platform package."
          exit 1
