name: Fork release

# The fork ships nightly only. The scripts keep upstream's stable/preview
# branches so merges stay clean, but nothing here can start them.
on:
  schedule:
    # Daily at 09:17 UTC (2:17 AM PDT, 1:17 AM PST). Skipped when main has no
    # new commits or the last nightly is less than six hours old.
    - cron: "17 9 * * *"
  # Manual runs release main immediately, without the due check.
  workflow_dispatch:

# Serialize publication, including the shared release index.
concurrency:
  group: fork-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

# Hosted/relay, marketing and AUR deployment are intentionally not invoked.
# Their accounts and fork-owned destinations are separate prerequisites (#276/#268).
jobs:
  due:
    if: github.repository == 'shuv1337/shuv2code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
      allowed_ref: ${{ steps.due.outputs.allowed_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: due
        uses: actions/github-script@v8
        with:
          script: |
            const { assertReleaseSource, shouldReleaseNightly, isAllowedForkPublishRef } = require('./.github/scripts/check-nightly-release.cjs');
            const allowed = isAllowedForkPublishRef(context.ref, context.payload.repository?.default_branch);
            core.setOutput('allowed_ref', String(allowed));
            if (!allowed) {
              core.setOutput('due', 'false');
              core.notice('Release skipped: nightly publication requires the default branch. No publisher token or protected environment requested.');
              return;
            }
            await assertReleaseSource({ github, context, releaseChannel: 'nightly' });
            const due = context.eventName !== 'schedule' || await shouldReleaseNightly({ github, context, core });
            core.setOutput('due', String(due));
            if (!due) core.notice('No release needed: unchanged nightly source or release interval not elapsed. No delivery attempted.');

  preflight:
    needs: due
    if: needs.due.outputs.due == 'true' && needs.due.outputs.allowed_ref == 'true'
    runs-on: ubuntu-24.04
    environment: fork-release
    timeout-minutes: 15
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      mac_signed: ${{ steps.plan.outputs.mac_signed }}
      win_signed: ${{ steps.plan.outputs.win_signed }}
      apple_team_id: ${{ steps.plan.outputs.apple_team_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
      due: ${{ needs.due.outputs.due }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - id: plan
        name: Resolve one nightly source/version, signing and npm policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: nightly
          # Sign each platform whose credentials are complete; otherwise the
          # release is labeled UNSIGNED.
          ALLOW_UNSIGNED: "true"
          FORK_NPM_TRUSTED_PUBLISHING_READY: ${{ vars.FORK_NPM_TRUSTED_PUBLISHING_READY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          RELEASE_DATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          export RELEASE_DATE
          node scripts/fork-release.ts preflight
      - name: Verify release logic
        run: vp test run scripts/lib/fork-release.test.ts scripts/fork-release.test.ts apps/server/scripts/publishOrder.test.ts scripts/build-npm-platform-packages.test.ts scripts/merge-update-manifests.test.ts scripts/build-desktop-artifact.test.ts scripts/update-release-package-versions.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error

  build_bundle:
    needs: preflight
    if: needs.preflight.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Align all compiled surfaces
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: [preflight, build_bundle]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: ${{ matrix.cli_archive }}
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      release_publication: true
      # Signing is resolved once, in the release environment; the build jobs
      # cannot see those secrets and must not resolve it again.
      mac_signed: ${{ needs.preflight.outputs.mac_signed == 'true' }}
      win_signed: ${{ needs.preflight.outputs.win_signed == 'true' }}
      # APPLE_TEAM_ID is a variable, and this job is outside the release
      # environment, so the team id comes from preflight rather than `vars`.
      apple_team_id: ${{ needs.preflight.outputs.apple_team_id }}

  prepare:
    needs: [preflight, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - uses: actions/download-artifact@v8
        with:
          name: release-plan
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: prepared/release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: prepared/release-assets
      - name: Build the six public packages once from the verified-source archives
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/build-npm-platform-packages.ts --archives-dir prepared/release-assets --version "$RELEASE_VERSION" --output-dir prepared/npm-packages
      - name: Verify complete matrix, source/WSL receipts, feeds and package allowlist
        run: node scripts/fork-release.ts prepare
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-prepared
          path: prepared/
          if-no-files-found: error

  publish:
    needs: [due, preflight, prepare]
    if: >-
      needs.due.outputs.allowed_ref == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04 # npm trusted publishing requires GitHub-hosted runners.
    environment: fork-release
    # npm reviews each new version before it is installable; publish waits for it.
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      FORK_NPM_TRUSTED_PUBLISHING_READY: ${{ vars.FORK_NPM_TRUSTED_PUBLISHING_READY }}
      NPM_TOKEN: ""
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Pin npm with OIDC publish and dist-tag support; no token fallback
        run: |
          npm install --global npm@11.21.0
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/fork-npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/fork-npmrc" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: fork-release-prepared
          path: prepared
      - name: Draft, verify, publish npm when ready, expose feeds and index last
        run: node scripts/fork-release.ts publish --execute
