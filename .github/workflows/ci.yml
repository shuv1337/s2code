name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the required status name used by Protect main.
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+ and pinned dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp run lint

      - name: Check fork identity and release invariants
        run: vp test run packages/shared/src/channelIdentity.test.ts packages/shared/src/productIdentity.test.ts scripts/lib/fork-release.test.ts
