name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the required status name used by Protect main.
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # actionlint 1.7.12 does not know concurrency.queue, which GitHub accepts.
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color -shellcheck= -pyflakes= -ignore 'unexpected key "queue" for "concurrency"'

      - name: Test macOS arm64 runner retry
        run: node --test .github/scripts/macos-arm64-runner-retry.test.cjs

      - name: Setup Vite+ and pinned dependencies
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp run lint

      - name: Check fork identity and release invariants
        run: vp test run packages/shared/src/channelIdentity.test.ts packages/shared/src/productIdentity.test.ts scripts/lib/fork-release.test.ts

      # Usage-limit pool failover is fork-only; no other server suite runs in this lane.
      - name: Test usage-limit failover
        run: vp test run --reporter=verbose --silent=passed-only apps/server/src/orchestration-v2/UsageLimitFailover.integration.test.ts
