name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Private fork: dispatch manually; ordinary main pushes do not trigger delivery.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
#
# Every merge to main that touches the mobile app reconciles, per platform:
#   1. Store builds: when no production build matches the current native
#      fingerprint, or the latest build's version differs from app.config.ts,
#      cut a new build and submit it (TestFlight + Play internal track). Native
#      changes therefore ship a binary on merge, and bumping `version` is all
#      it takes to start the next release train — the first build of a version enters
#      external-TestFlight beta review immediately, and later builds of the
#      same version auto-approve until that version is released. After App
#      Store approval, Apple closes the release train and `version` must be
#      bumped before another iOS build can be submitted. Releasing to the App
#      Store stays a manual App Store Connect step.
#   2. OTA (explicitly enabled only): publish a production-channel update where at
#      least one finished production build matches the current native
#      fingerprint. Older binaries of the same major version with a matching
#      fingerprint receive it too; the major version is part of the
#      fingerprint (apps/mobile/fingerprint.config.js), so a new major never
#      reaches the previous major's store binaries over the air. Until a
#      build for the new fingerprint finishes, the OTA is skipped rather than
#      published into the void.
#      With OTA off, a matching native fingerprint does not ship JS changes;
#      unchanged content in the highest-numbered finished production binary needs no replacement.
#      Undelivered content fails with manual build instructions.
# Hold native-change PRs (the "📱 Native Change" label) and merge them as a
# batch to avoid a store build per PR.
# workflow_dispatch remains as a manual override for both modes (e.g. to
# retry an errored build or force an OTA).
# Manual v2-preview builds keep the production app identity and disable OTA.
# They auto-submit to TestFlight and the Google Play closed testing track v2.
# Select the v2 branch when dispatching a preview build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (+ auto-submit to TestFlight / Google Play) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      profile:
        description: "Store build profile (v2-preview: TestFlight + Play closed track v2; build only)"
        required: true
        type: choice
        default: production
        options:
          - production
          - v2-preview
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: all
        options:
          - ios
          - android
          - all
      version:
        description: "Optional build version override (blank uses app.config.ts; an override is committed before building)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

# Serialize runs so OTAs publish in merge order. GitHub keeps at most one
# queued run per group, so a burst of merges collapses into one run of the
# newest commit — intermediate commits don't need their own OTA.
concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS ${{ inputs.profile || 'production' }} ${{ github.event_name == 'push' && 'auto' || inputs.mode }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      GOOGLE_PLAY_PROJECT_ID: ${{ vars.GOOGLE_PLAY_PROJECT_ID }}
      GOOGLE_PLAY_TRACK: ${{ vars.GOOGLE_PLAY_TRACK }}
      GOOGLE_PLAY_PREVIEW_TRACK: ${{ vars.GOOGLE_PLAY_PREVIEW_TRACK }}
      MOBILE_UPDATES_ENABLED: ${{ vars.MOBILE_UPDATES_ENABLED || '0' }}
      MOBILE_PUSH_ENABLED: ${{ vars.MOBILE_PUSH_ENABLED || '0' }}
      MOBILE_AUTH_ENABLED: ${{ vars.MOBILE_AUTH_ENABLED || '0' }}
      MOBILE_AUTH_DOMAIN: ${{ vars.MOBILE_AUTH_DOMAIN }}
      MOBILE_RELAY_URL: ${{ vars.MOBILE_RELAY_URL }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
      MOBILE_RELEASE_MODE: ${{ github.event_name == 'push' && 'build' || inputs.mode }}
      MOBILE_RELEASE_PLATFORM: ${{ inputs.platform || 'all' }}
    steps:
      - name: Reject preview OTA updates
        if: github.event_name == 'workflow_dispatch' && inputs.profile == 'v2-preview' && inputs.mode == 'update'
        run: |
          echo "::error::V2 previews use store builds only. Select mode=build."
          exit 1

      - id: expo-token
        name: Require release authorization (missing configuration is a failure)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::EXPO_TOKEN is required for release-intent workflows; no build or OTA was delivered."
            exit 1
          fi

      - id: version_app_token
        name: Mint release app token for version override
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build' && inputs.version != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.version_app_token.outputs.token || github.token }}
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Verify v2 preview source
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.profile == 'v2-preview'
        run: |
          node --input-type=module -e '
            import * as environment from "./packages/contracts/src/environment.ts";
            if (environment.ORCHESTRATION_PROTOCOL_VERSION !== 2) {
              throw new Error("V2 previews require a v2 source branch. Select the v2 branch when running this workflow.");
            }
          '

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Verify fork Expo identity before the first environment pull
        if: steps.expo-token.outputs.present == 'true'
        run: node scripts/mobile-release-preflight.ts project --mode "$MOBILE_RELEASE_MODE" --profile "$MOBILE_BUILD_PROFILE" --platform "$MOBILE_RELEASE_PLATFORM"

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Verify resolved fork identities, store access and enabled capabilities
        if: steps.expo-token.outputs.present == 'true'
        run: node scripts/mobile-release-preflight.ts prepare --mode "$MOBILE_RELEASE_MODE" --profile "$MOBILE_BUILD_PROFILE" --platform "$MOBILE_RELEASE_PLATFORM"

      - name: Apply manual version override
        if: steps.version_app_token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.version_app_token.outputs.token }}
          APP_SLUG: ${{ steps.version_app_token.outputs.app-slug }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Version overrides require dispatching this workflow from a branch; received $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Version override must contain two or three dot-separated integers; received '$RELEASE_VERSION'." >&2
            exit 1
          fi

          node --input-type=module -e '
            import fs from "node:fs";
            const path = "apps/mobile/app.config.ts";
            const source = fs.readFileSync(path, "utf8");
            const next = source.replace(
              /^(  version: ")[^"]+(".*)$/m,
              `$1${process.env.RELEASE_VERSION}$2`,
            );
            if (next === source && !source.includes(`  version: "${process.env.RELEASE_VERSION}"`)) {
              throw new Error("Could not update app version");
            }
            fs.writeFileSync(path, next);
          '
          vp fmt apps/mobile/app.config.ts

          if git diff --quiet -- apps/mobile/app.config.ts; then
            echo "app.config.ts is already at $RELEASE_VERSION; no version commit needed."
            exit 0
          fi

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add apps/mobile/app.config.ts
          git commit \
            -m "chore(mobile): bump app version to $RELEASE_VERSION" \
            -m "Co-authored-by: codex <codex@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Summarize manual build version
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: |
          version="$(npx expo config --json --type public | jq -r '.version')"
          {
            echo "## Manual $MOBILE_BUILD_PROFILE build"
            echo
            echo "- App version: \`$version\`"
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo
            echo "> Apple closes an iOS release train after App Store approval. Before building iOS, confirm \`$version\` is newer than the approved App Store version."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and submit (manual)
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: eas build --platform ${{ inputs.platform }} --profile "$MOBILE_BUILD_PROFILE" --auto-submit --non-interactive --no-wait

      # @expo/fingerprint swallows autolinking errors and returns no Expo module
      # sources, so native changes stop moving the hash and OTAs reach binaries
      # that lack them. Refuse to publish any OTA from such a fingerprint.
      - name: Verify fingerprints hash Expo native modules
        if: steps.expo-token.outputs.present == 'true' && (github.event_name == 'push' || inputs.mode == 'update')
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          if [ "$PLATFORM" = "all" ]; then platforms="ios android"; else platforms="$PLATFORM"; fi
          failed=0
          for platform in $platforms; do
            # eas-cli prints an environment-loaded notice to stdout before the
            # JSON even with --json, so discard everything before the document.
            expo_modules="$(eas fingerprint:generate --platform "$platform" --environment production --json --non-interactive | sed -n '/^{/,$p' | jq --arg reason "expoAutolinking${platform^}" '[.sources[] | select((.reasons // []) | index($reason))] | length')"
            if [ "${expo_modules:-0}" -eq 0 ]; then
              failed=1
              echo ":x: $platform: the native fingerprint hashes no Expo native modules — OTAs and builds skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"

      - name: Publish OTA update (manual)
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Publishing into an unmatched runtime is not delivery. Require a finished fork binary.
          for platform in $( [ "${{ inputs.platform }}" = all ] && echo 'ios android' || echo '${{ inputs.platform }}' ); do
            hash="$(eas fingerprint:generate --platform "$platform" --environment production --json --non-interactive | sed -n '/^{/,$p' | jq -er '.hash')"
            finished="$(eas build:list --platform "$platform" --build-profile production --fingerprint-hash "$hash" --json --non-interactive | jq '[.[] | select(.status == "FINISHED")] | length')"
            [ "$finished" -gt 0 ] || { echo "::error::No finished fork $platform binary matches this OTA runtime."; exit 1; }
          done
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --emit-metadata \
            --non-interactive

      # One pass per platform. The fingerprint decides OTA vs store build:
      #   - a finished build matches → publish the OTA;
      #   - a queued/in-progress build matches → wait, the next merge after it
      #     finishes publishes the OTA (no duplicate build per merge);
      #   - no build matches → native drift, so cut and submit a new build.
      # A version bump also cuts a build even when native code is unchanged,
      # because only the major version is part of the fingerprint.
      # An errored build for this fingerprint is not retried on push (it would
      # rebuild on every merge); retry via workflow_dispatch mode=build.
      # With OTA disabled, a matching native build does not prove these JS
      # changes shipped. Compare committed mobile inputs against the finished
      # matching binary's source revision before requiring a manual release.
      - id: reconcile
        name: Publish OTA or cut store build
        if: steps.expo-token.outputs.present == 'true' && github.event_name == 'push'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          failed=0
          version="$(npx expo config --json --type public | jq -r '.version')"
          message="$(git log -1 --pretty=%s | head -c 120) ($(git rev-parse --short=9 HEAD))"
          for platform in ios android; do
            # eas-cli prints an environment-loaded notice to stdout before the
            # JSON even with --json, so discard everything before the document.
            hash="$(eas fingerprint:generate --platform "$platform" --environment production --json --non-interactive | sed -n '/^{/,$p' | jq -er '.hash | select(type == "string" and length > 0)')"
            matches="$(eas build:list --platform "$platform" --build-profile production --fingerprint-hash "$hash" --limit 20 --json --non-interactive)"
            finished="$(jq '[.[] | select(.status == "FINISHED")] | length' <<<"$matches")"
            active="$(jq '[.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS")] | length' <<<"$matches")"
            errored="$(jq '[.[] | select(.status == "ERRORED")] | length' <<<"$matches")"
            latest_version="$(eas build:list --platform "$platform" --build-profile production --limit 1 --json --non-interactive | jq -r '.[0].appVersion // "none"')"

            if [ "$finished" -gt 0 ] && [ "$MOBILE_UPDATES_ENABLED" = 1 ]; then
              if eas update \
                --channel production \
                --environment production \
                --platform "$platform" \
                --message "$message" \
                --emit-metadata \
                --non-interactive; then
                echo ":white_check_mark: $platform: OTA published to production (fingerprint \`$hash\`)" >> "$GITHUB_STEP_SUMMARY"
                # The next target's export replaces dist; keep this one for the map upload.
                rm -rf "dist-$platform" && mv dist "dist-$platform"
              else
                failed=1
                echo ":x: $platform: OTA publish failed (fingerprint \`$hash\`)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            reason=""
            if [ "$finished" -eq 0 ] && [ "$active" -eq 0 ]; then
              if [ "$errored" -gt 0 ]; then
                echo ":x: $platform: the production build for fingerprint \`$hash\` errored — retry with workflow_dispatch mode=build" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                continue
              fi
              reason="native fingerprint \`$hash\` has no build"
            elif [ "$latest_version" != "$version" ] && [ "$active" -eq 0 ]; then
              reason="latest production build is $latest_version, app.config.ts says $version"
            fi

            if [ -z "$reason" ]; then
              if [ "$MOBILE_UPDATES_ENABLED" != 1 ]; then
                # Select by build number across production, NOT just matching fingerprints.
                # A revert may match an old binary while the newer store binary differs.
                production_builds="$(mktemp)"
                echo '[]' > "$production_builds"
                offset=0
                while :; do
                  page="$(eas build:list --platform "$platform" --build-profile production --status finished --limit 50 --offset "$offset" --json --non-interactive)"
                  jq --argjson page "$page" '. + $page' "$production_builds" > "$production_builds.next"
                  mv "$production_builds.next" "$production_builds"
                  if [ "$(jq 'length' <<<"$page")" -lt 50 ]; then break; fi
                  offset=$((offset + 50))
                  if [ "$offset" -ge 10000 ]; then echo 'Cannot verify complete production build history' >&2; exit 1; fi
                done
                if node ../../scripts/mobile-content-delivered.ts --builds-file "$production_builds" "$version" "$hash"; then
                  rm "$production_builds"
                  echo "::notice::$platform: mobile inputs are unchanged from a finished matching binary; no replacement release is needed."
                  echo ":white_check_mark: $platform: mobile inputs are unchanged from a finished matching binary; OTA remains disabled." >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
                rm "$production_builds"
                echo "::error::$platform: OTA is disabled and no replacement binary was scheduled. Run Mobile EAS Production via workflow_dispatch with mode=build, profile=production, platform=$platform on this commit."
                echo ":x: $platform: OTA is disabled; JS changes are not delivered by a matching native fingerprint. Run workflow_dispatch with mode=build, profile=production, platform=$platform on this commit." >> "$GITHUB_STEP_SUMMARY"
                failed=1
                continue
              fi
              if [ "$finished" -eq 0 ]; then
                echo ":hourglass: $platform: production build for fingerprint \`$hash\` is in progress — OTA resumes on the next merge after it finishes" >> "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi

            echo "$platform: $reason — building"
            if eas build --platform "$platform" --profile production --auto-submit --non-interactive --no-wait; then
              echo ":building_construction: $platform: scheduled production build and submission for $version ($reason)" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo ":x: $platform: production build or submission failed for $version" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"

      - name: Clean generated submission credentials
        if: always()
        run: |
          case "${MOBILE_SUBMISSION_CREDENTIALS_DIR:-}" in
            "$RUNNER_TEMP"/fork-mobile-submit-*) rm -rf -- "$MOBILE_SUBMISSION_CREDENTIALS_DIR" ;;
            '') ;;
            *) echo 'Unexpected credential directory; refusing cleanup.' >&2; exit 1 ;;
          esac

      # Lets the relay symbolicate crash stacks from the updates published
      # above. A step of its own so the R2 credentials reach only this script,
      # not `eas update` and the dependencies it runs. Never fails the job.
      - name: Upload OTA source maps
        if: ${{ !cancelled() && steps.expo-token.outputs.present == 'true' }}
        working-directory: apps/mobile
        env:
          MOBILE_SOURCEMAPS_R2: ${{ secrets.MOBILE_SOURCEMAPS_R2 }}
        run: |
          for dir in dist dist-*; do
            if [ -f "$dir/eas-update-metadata.json" ]; then
              node scripts/upload-sourcemaps.mts ota "$dir"
            fi
          done
