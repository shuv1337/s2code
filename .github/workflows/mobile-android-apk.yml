name: Mobile Android APK

# Publishes the newest nightly-compatible Android build as a sideloadable APK
# on the rolling "android-nightly" prerelease, for nightly users who can't join
# the Play testing group. Play re-signs uploaded bundles with the app signing
# key, so its universal APK matches the Play Store install and needs no signing
# secrets here. EAS submits asynchronously (--no-wait), so this polls Play
# instead of chaining off mobile-eas-production.yml; runs with nothing new exit
# early.
on:
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: mobile-android-apk
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror Play APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_NAME: dev.shuv.shuv2code
      # eas.json submits v2-preview builds to this closed testing track; they
      # speak the orchestration protocol nightly servers use, which the Play
      # Store release can't.
      PLAY_TRACK: ${{ vars.GOOGLE_PLAY_PREVIEW_TRACK }}
      RELEASE_TAG: android-nightly
      GOOGLE_PLAY_PROJECT_ID: ${{ vars.GOOGLE_PLAY_PROJECT_ID }}
      GOOGLE_PLAY_SIGNING_CERT_SHA256: ${{ vars.GOOGLE_PLAY_SIGNING_CERT_SHA256 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Fail closed on missing or foreign mirror configuration
        run: node .github/scripts/mirror-play-apk.cjs --check-config

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android identity/signature tools
        uses: android-actions/setup-android@v3

      - name: Expose APK verification tools
        run: |
          sdkmanager 'build-tools;36.0.0' 'cmdline-tools;latest'
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Mirror the newest APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/mirror-play-apk.cjs
